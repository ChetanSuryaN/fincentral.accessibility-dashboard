    // --- Lucide Icon Helper ---
    function Icon({ name, className = "w-4 h-4", size = 16 }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current && window.lucide) {
          containerRef.current.innerHTML = '';
          const iconObj = window.lucide.icons[name] || window.lucide.icons.Sparkles || window.lucide.icons.HelpCircle;
          if (iconObj) {
            const iconElement = window.lucide.createElement(iconObj);
            iconElement.setAttribute('class', className);
            iconElement.setAttribute('width', size);
            iconElement.setAttribute('height', size);
            containerRef.current.appendChild(iconElement);
          }
        }
      }, [name, className, size]);

      return <span ref={containerRef} className="inline-flex items-center justify-center flex-shrink-0" />;
    }

    // --- Web Speech API Hook ---
    function useTTS(currentLang) {
      const [isSpeaking, setIsSpeaking] = useState(false);

      const getBCP47Tag = (lang) => {
        if (lang === 'hi') return 'hi-IN';
        if (lang === 'kn') return 'kn-IN';
        return 'en-IN';
      };

      const stop = () => {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          setIsSpeaking(false);
        }
      };

      const speak = (text, langOverride) => {
        if (!text || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();

        const targetLang = langOverride || currentLang;
        const bcp47 = getBCP47Tag(targetLang);

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = bcp47;
        utterance.rate = targetLang === 'en' ? 0.95 : 0.9;

        const voices = window.speechSynthesis.getVoices();
        const matchingVoice = voices.find(v => v.lang === bcp47 || v.lang.startsWith(targetLang));
        if (matchingVoice) utterance.voice = matchingVoice;

        utterance.onstart = () => setIsSpeaking(true);
        utterance.onend = () => setIsSpeaking(false);
        utterance.onerror = () => setIsSpeaking(false);

        window.speechSynthesis.speak(utterance);
      };

      useEffect(() => {
        return () => {
          if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        };
      }, [currentLang]);

      return { speak, stop, isSpeaking };
    }

    // --- Component: Breadcrumbs ---
    function Breadcrumbs({ route, accountId, translations, onNavigate, onSpeak, highContrast }) {
      const t = translations;

      const crumbs = [
        {
          id: 'home',
          label: t.home,
          iconName: 'Home',
          target: { view: 'home', accountId: null, action: null },
          isActive: route.view === 'home'
        }
      ];

      if (accountId && route.view !== 'home') {
        const accTrans = t.accounts[accountId];
        const accountLabel = accTrans ? accTrans.name : accountId;
        crumbs.push({
          id: 'account',
          label: accountLabel,
          target: { view: 'account', accountId: accountId, action: null },
          isActive: route.view === 'account'
        });
      }

      if (route.action && (route.view === 'auth' || route.view === 'summary')) {
        const actionLabel = route.action === 'create' ? t.createTitle : t.loginTitle;
        crumbs.push({
          id: 'action',
          label: actionLabel,
          target: { view: 'auth', accountId: route.accountId, action: route.action },
          isActive: route.view === 'auth'
        });
      }

      if (route.view === 'summary') {
        crumbs.push({
          id: 'summary',
          label: t.tabAiInsights,
          target: { view: 'summary', accountId: route.accountId, action: route.action },
          isActive: true
        });
      }

      const breadcrumbSpeech = crumbs.map(c => c.label).join(' ➔ ');

      return (
        <nav 
          aria-label="Breadcrumb Navigation"
          className={`w-full px-4 sm:px-8 py-3 sticky top-28 z-30 transition-all border-b ${
            highContrast ? 'bg-black border-amber-400 text-yellow-300' : 'bg-slate-900/90 backdrop-blur-md border-slate-800/80'
          }`}
        >
          <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
            <ol className="flex items-center flex-wrap gap-2 text-sm sm:text-base font-semibold">
              {crumbs.map((crumb, index) => {
                const isLast = index === crumbs.length - 1;

                return (
                  <li key={crumb.id} className="flex items-center">
                    {index > 0 && (
                      <span className={`mx-2 text-base font-bold flex-shrink-0 ${
                        highContrast ? 'text-yellow-400' : 'text-emerald-400'
                      }`} aria-hidden="true">
                        ➔
                      </span>
                    )}
                    <button
                      type="button"
                      onClick={() => onNavigate(crumb.target)}
                      className={`group inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl transition-all cursor-pointer ${
                        isLast
                          ? highContrast
                            ? 'bg-yellow-400 text-black font-extrabold ring-2 ring-yellow-300'
                            : 'bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/40 shadow-sm'
                          : highContrast
                            ? 'text-yellow-200 hover:text-white hover:bg-zinc-800 underline'
                            : 'text-slate-300 hover:text-white hover:bg-slate-800/90'
                      }`}
                    >
                      {crumb.iconName && <Icon name={crumb.iconName} className="w-4 h-4 flex-shrink-0" />}
                      <span>{crumb.label}</span>
                    </button>
                  </li>
                );
              })}
            </ol>

            <button
              type="button"
              onClick={() => onSpeak(breadcrumbSpeech)}
              className={`px-2.5 py-1 rounded-lg text-xs font-semibold flex items-center gap-1.5 transition-colors cursor-pointer ${
                highContrast ? 'bg-yellow-400 text-black' : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700'
              }`}
            >
              <Icon name="Volume2" className="w-3.5 h-3.5 text-emerald-400" />
              <span>{t.listen}</span>
            </button>
          </div>
        </nav>
      );

              <div className="mt-4 pt-3 border-t border-slate-800 text-xs font-bold text-emerald-400">
                {t.consentActive}
              </div>
            </div>

            <div className={`p-6 rounded-3xl border-2 shadow-lg flex flex-col justify-between ${
              highContrast ? 'bg-black border-amber-400 text-yellow-300' : 'bg-slate-900 border-slate-800'
            }`}>
              <div>
                <p className="text-xs font-bold uppercase text-slate-400 tracking-wider">
                  Easy Statement
                </p>
                <p className="text-xs text-slate-300 mt-2 font-medium">
                  Save a simple one-page summary on your phone or print it for your family.
                </p>
              </div>
              <button
                type="button"
                onClick={() => alert("Statement downloaded in " + t.langName)}
                className="mt-4 w-full py-2.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold border border-slate-700 flex items-center justify-center gap-2 cursor-pointer"
              >
                <Icon name="Download" className="w-4 h-4" />
                <span>{t.downloadPdf}</span>
              </button>
            </div>
          </div>

          <div className="flex items-center gap-2 border-b border-slate-800 pb-3">
            <button
              type="button"
              onClick={() => setActiveTab('insights')}
              className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-sm font-extrabold transition-all cursor-pointer ${
                activeTab === 'insights'
                  ? 'bg-emerald-600 text-white shadow-lg'
                  : 'text-slate-400 hover:text-white hover:bg-slate-900'
              }`}
            >
              <Icon name="Sparkles" className="w-4 h-4" />
              <span>{t.tabAiInsights}</span>
            </button>

            <button
              type="button"
              onClick={() => setActiveTab('holdings')}
              className={`flex items-center gap-2 px-5 py-2.5 rounded-2xl text-sm font-extrabold transition-all cursor-pointer ${
                activeTab === 'holdings'
                  ? 'bg-slate-800 text-white border border-slate-700'
                  : 'text-slate-400 hover:text-white hover:bg-slate-900'
              }`}
            >
              <Icon name="Layers" className="w-4 h-4" />
              <span>{t.tabHoldings}</span>
            </button>
          </div>

          {activeTab === 'insights' && (
            <AIInsightsPanel 
              account={account} 
              translations={translations}
              onSpeak={onSpeak}
              highContrast={highContrast}
            />
          )}

          {activeTab === 'holdings' && (
            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl animate-fadeIn">
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="text-xs uppercase text-slate-400 bg-slate-950/60 border-y border-slate-800 font-bold">
                    <tr>
                      <th className="py-3 px-4">Item</th>
                      <th className="py-3 px-4">Units</th>
                      <th className="py-3 px-4">Rate</th>
                      <th className="py-3 px-4">Total Value</th>
                      <th className="py-3 px-4 text-right">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-slate-200">
                    {portfolio.holdings.map((holding, idx) => (
                      <tr key={idx} className="hover:bg-slate-800/40">
                        <td className="py-3.5 px-4 font-bold text-white">{holding.name}</td>
                        <td className="py-3.5 px-4 text-xs font-semibold">{holding.units}</td>
                        <td className="py-3.5 px-4 text-xs font-semibold">{holding.nav}</td>
                        <td className="py-3.5 px-4 font-extrabold text-white">{holding.value}</td>
                        <td className="py-3.5 px-4 text-right font-bold text-emerald-400 text-xs">
                          {holding.gain}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Component: Footer ---
    function Footer({ translations, highContrast }) {
      const t = translations;

      return (
        <footer className={`mt-20 border-t py-10 transition-colors ${
          highContrast ? 'bg-black border-amber-400 text-yellow-300' : 'bg-slate-950/90 border-slate-800/80 text-slate-400'
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-8 space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 pb-6 border-b border-slate-800/60 text-xs font-semibold">
              <div className="flex items-center gap-3">
                <div className="p-2 rounded-xl bg-emerald-500/10 text-emerald-400">
                  <Icon name="ShieldCheck" className="w-5 h-5" />
                </div>
                <div>
                  <p className="text-slate-200">{t.rbiCompliant}</p>
                  <p className="text-slate-400">{t.footerGovt}</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="p-2 rounded-xl bg-blue-500/10 text-blue-400">
                  <Icon name="Lock" className="w-5 h-5" />
                </div>
                <div>
                  <p className="text-slate-200">256-Bit TLS Security</p>
                  <p className="text-slate-400">{t.footerPrivacy}</p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="p-2 rounded-xl bg-purple-500/10 text-purple-400">
                  <Icon name="Globe" className="w-5 h-5" />
                </div>
                <div>
                  <p className="text-slate-200">Multilingual Voice Support</p>
                  <p className="text-slate-400">English • हिंदी • ಕನ್ನಡ</p>
                </div>
              </div>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-between gap-4 text-center sm:text-left text-xs">
              <p className="text-slate-400">
                {t.footerCopyright}
              </p>
              <div className="flex items-center gap-4 text-xs font-bold text-emerald-400">
                <span>{t.networkOnline}</span>
                <span>•</span>
                <span>Accessibility Grade AAA</span>
              </div>
            </div>
          </div>
        </footer>
      );
    }

    // --- Root App Container ---
    function App() {
      const [currentLang, setCurrentLang] = useState('en');
      const [highContrast, setHighContrast] = useState(false);
      const [largeText, setLargeText] = useState(false);

      const [route, setRoute] = useState({
        view: 'home',
        accountId: null,
        action: null
      });

      const [lastSubmission, setLastSubmission] = useState(null);
      const t = TRANSLATIONS[currentLang] || TRANSLATIONS['en'];
      const { speak, stop, isSpeaking } = useTTS(currentLang);

      const handleNavigate = (targetRoute) => {
        stop();
        setRoute(targetRoute);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelectAccount = (accountId) => {
        stop();
        setRoute({
          view: 'account',
          accountId: accountId,
          action: null
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleSelectAction = (action) => {
        stop();
        setRoute(prev => ({
          ...prev,
          view: 'auth',
          action: action
        }));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleFormSubmitSuccess = (submissionData) => {
        stop();
        setLastSubmission(submissionData);
        setRoute(prev => ({
          ...prev,
          view: 'summary'
        }));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleResetToHome = () => {
        stop();
        setRoute({
          view: 'home',
          accountId: null,
          action: null
        });
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      const handleTriggerGlobalTTS = () => {
        if (route.view === 'home') {
          speak(`${t.heroTitle}. ${t.heroDesc}`);
        } else if (route.view === 'account' && route.accountId) {
          const acc = t.accounts[route.accountId];
          speak(`${acc.name}. ${acc.tagline}. ${t.actionPromptTitle}.`);
        } else if (route.view === 'auth') {
          speak(`${route.action === 'create' ? t.createTitle : t.loginTitle}. ${t.termsConsent}`);
        } else if (route.view === 'summary') {
          if (route.accountId === 'savings') speak(t.savingsAI.balanceSpeech);
          else if (route.accountId === 'mutual-funds') speak(`${t.mutualFundsAI.analogyText} ${t.mutualFundsAI.navExplanation}`);
          else if (route.accountId === 'demat') speak(t.dematAI.varianceGainText);
        }
      };

      const currentAccountConfig = ACCOUNT_TYPES.find(acc => acc.id === route.accountId) || null;

      return (
        <div className={`min-h-screen flex flex-col font-sans transition-colors ${
          highContrast ? 'bg-black text-yellow-300' : 'bg-slate-950 text-slate-100'
        } ${largeText ? 'text-lg' : 'text-base'}`}>
          
          <Navbar 
            currentLang={currentLang}
            onSelectLang={(lang) => {
              stop();
              setCurrentLang(lang);
            }}
            translations={t}
            highContrast={highContrast}
            onToggleContrast={() => setHighContrast(!highContrast)}
            largeText={largeText}
            onToggleLargeText={() => setLargeText(!largeText)}
            isSpeaking={isSpeaking}
            onTriggerGlobalTTS={handleTriggerGlobalTTS}
            onStopTTS={stop}
            onReset={handleResetToHome}
          />

          <Breadcrumbs 
            route={route} 
            accountId={route.accountId}
            translations={t}
            onNavigate={handleNavigate}
            onSpeak={speak}
            highContrast={highContrast}
          />

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-8 py-8">
            {route.view === 'home' && (
              <DashboardHome 
                accounts={ACCOUNT_TYPES} 
                translations={t}
                onSelectAccount={handleSelectAccount} 
                onSpeak={speak}
                stats={SYSTEM_STATS}
                highContrast={highContrast}
              />
            )}

            {route.view === 'account' && currentAccountConfig && (
              <AccountActionView 
                account={currentAccountConfig}
                translations={t}
                onSelectAction={handleSelectAction}
                onBack={handleResetToHome}
                onSpeak={speak}
                highContrast={highContrast}
              />
            )}

            {route.view === 'auth' && currentAccountConfig && route.action && (
              <AuthFormView 
                account={currentAccountConfig}
                action={route.action}
                translations={t}
                onSubmitSuccess={handleFormSubmitSuccess}
                onBack={() => setRoute({ view: 'account', accountId: route.accountId, action: null })}
                onSpeak={speak}
                highContrast={highContrast}
              />
            )}

            {route.view === 'summary' && currentAccountConfig && (
              <AggregatedSummary 
                account={currentAccountConfig}
                action={route.action || 'login'}
                translations={t}
                onReturnHome={handleResetToHome}
                onSpeak={speak}
                highContrast={highContrast}
              />
            )}
          </main>

          <Footer 
            translations={t}
            highContrast={highContrast}
          />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
